name: Unit test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: unit-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verification: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: application
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r application/backend/requirements.txt
          npm ci --prefix application/frontend
      - name: Run baseline suites and build
        id: tests
        run: python controller/test-agent/verify.py --root application --output baseline-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: baseline-results
          path: baseline-results/
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: baseline
    if: >-
      always() && !cancelled() &&
      (needs.baseline.outputs.verification == 'success' || needs.baseline.outputs.verification == 'failure') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseline-results
          path: baseline-results
      - name: Generate test proposal without executing PR code
        env:
          TEST_AGENT_API_KEY: ${{ secrets.TEST_AGENT_API_KEY }}
          TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL || 'gpt-4.1' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python controller/test-agent/agent.py prepare
          --root application --base "$BASE_SHA" --head "$HEAD_SHA" --output proposal
          --baseline baseline-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-proposal
          path: proposal/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: propose
    if: always() && !cancelled() && needs.propose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: application
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-proposal
          path: proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseline-results
          path: baseline-results
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate paths and apply proposal to exact PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python controller/test-agent/agent.py apply --root application
          --head "$HEAD_SHA" --proposal proposal/proposal.json
      - name: Install dependencies
        run: |
          python -m pip install -r application/backend/requirements.txt
          npm ci --prefix application/frontend
      - name: Run proposed tests, full suites and build without model credentials
        run: python controller/test-agent/verify.py --root application --output proposal-results --baseline baseline-results/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proposal-results
          path: proposal-results/
          if-no-files-found: error
          retention-days: 7
